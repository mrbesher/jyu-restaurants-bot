name: Post Daily Menus to Telegram

on:
  schedule:
    - cron: "00 6 * * 1-5"
    - cron: "30 5 * * 1"
  workflow_dispatch:

jobs:
  post-menus:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '00 6 * * 1-5' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            location_cache.json
            translation_cache.json
          key: menu-bots-cache-${{ github.run_id }}
          restore-keys: menu-bots-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run diet bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.VEGAN_CHANNEL_ID }}
        run: uv run app.py

      - name: Run halal bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.HALAL_CHANNEL_ID }}
        run: uv run halal_app.py

  post-weekly-picks:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 5 * * 1' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run weekly pizza & fish bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.HALAL_CHANNEL_ID }}
        run: uv run weekly_app.py
